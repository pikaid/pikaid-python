name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify stable tag matches package and runtime versions
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a stable SemVer tag such as v1.0.1"
            exit 1
          fi
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = os.environ["GITHUB_REF_NAME"][1:]
          with pathlib.Path("pyproject.toml").open("rb") as stream:
              declared = tomllib.load(stream)["project"]["version"]
          source = pathlib.Path("src/pikaid/__init__.py").read_text()
          if declared != version or f'__version__ = "{version}"' not in source:
              raise SystemExit(
                  f"Release tag is {version}, but pyproject.toml is {declared}. "
                  "Update pyproject.toml and src/pikaid/__init__.py before tagging."
              )
          print(f"Verified package version {version}")
          PY

      - name: Install verification and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify formatting, lint and types
        run: |
          ruff format --check .
          ruff check .
          mypy src

      - name: Run tests with required 100% coverage
        run: pytest --cov=pikaid --cov-report=term-missing --cov-fail-under=100

      - name: Build wheel and sdist
        env:
          SOURCE_DATE_EPOCH: "0"
        run: python -m build

      - name: Verify distribution metadata
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"][1:]
          expected = {
              f"pikaid-{version}-py3-none-any.whl",
              f"pikaid-{version}.tar.gz",
          }
          actual = {p.name for p in Path("dist").iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected distribution files: {actual!r} != {expected!r}")
          PY

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI via OIDC
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-pypi-distributions
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
