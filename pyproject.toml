[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pikaid"
version = "1.0.0"
description = "Official Python implementation of pikaid: compact, sortable, CSPRNG-backed identifiers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "larananas (Lara G.)", email = "larananas.dev@proton.me" },
]
keywords = ["pikaid", "identifier", "id", "base36", "sortable"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pikaid"
Repository = "https://github.com/pikaid/pikaid-python"
Specification = "https://github.com/pikaid/pikaid-specs/tree/v1.0.4"
Issues = "https://github.com/pikaid/pikaid-python/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pikaid",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]
# Defense in depth: .ai/ is local-only and must never reach a source archive,
# even if the .gitignore rule is ever loosened or a file is force-added.
exclude = [
    "/.ai",
    "/.github",
    "/.venv*",
    "/dist",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/.hypothesis",
    "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pikaid"]
# Defense in depth: the wheel contains the import package only.
exclude = [
    "/.ai",
    "**/__pycache__",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pikaid"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pikaid"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/pikaid"]
